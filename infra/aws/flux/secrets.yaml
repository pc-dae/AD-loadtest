# Copies the domain passwords from the Terraform outputs Secret into the app's namespace as
# ad-loadtest-ad, the chart's secrets.existingSecret. Waits for both the namespace, created by the
# apps ResourceSet, and the outputs, written once the domain controllers have been created.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: ad-loadtest-secrets
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "5m"
spec:
  dependsOn:
    - apiVersion: v1
      kind: Namespace
      name: ad-loadtest
    - apiVersion: v1
      kind: Secret
      name: ad-loadtest-ad-outputs
      namespace: flux-system
  resources:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: ad-loadtest-ad
        namespace: ad-loadtest
        annotations:
          fluxcd.controlplane.io/copyFrom: flux-system/ad-loadtest-ad-outputs
      type: Opaque
