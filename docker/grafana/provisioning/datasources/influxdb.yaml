apiVersion: 1
datasources:
  - name: JMeter
    uid: influx-jmeter
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: jmeter
      httpMode: GET
    isDefault: true
  - name: Telegraf
    uid: influx-telegraf
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      dbName: telegraf
      httpMode: GET
