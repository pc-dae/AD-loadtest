[agent]
  interval = "5s"
  flush_interval = "5s"
  hostname = "lab"

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"

# CPU/memory/network of the lab containers, so DC load sits next to JMeter metrics.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  total_include = ["cpu", "blkio", "network"]
  container_name_include = ["ad-loadtest-*"]
