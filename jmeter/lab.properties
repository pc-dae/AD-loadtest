# Target: the local Samba AD DC from docker-compose.
# For another domain, copy this file and pass it with PROPS=... (see README).
ad.host=dc1.lab.local
ad.domain=LAB
ad.realm=LAB.LOCAL
ad.upnSuffix=lab.local
ad.baseDn=DC=lab,DC=local

ldap.port=636
ldap.tls=true
ldap.trustAll=true
ldap.connectTimeoutMs=5000
ldap.responseTimeoutMs=10000

# user = bind as each user and check their own membership
# service = long-lived service-account connection does the lookups (app-server pattern)
authz.bindAs=user
authz.groupDn=CN=LT-Authorised,CN=Users,DC=lab,DC=local
authz.serviceUser=svc-ltapp
authz.servicePassword=LoadTest-Passw0rd

kerberos.spn=ldap@dc1.lab.local

smb.share=netlogon
smb.minVersion=SMB202
smb.maxVersion=SMB210

# Load profile: threads per protocol (0 disables that thread group).
users.csv=/data/users.csv
ldap.threads=5
kerberos.threads=5
ntlm.threads=5
rampup=10
duration=120
think.ms=0

# Live metrics for Grafana.
influx.url=http://influxdb:8086/write?db=jmeter
app=ad-loadtest
