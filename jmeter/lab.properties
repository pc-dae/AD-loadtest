# Target: the local Samba AD DC from docker-compose.
# For another domain, copy this file and pass it with PROPS=... (see README).
# ad.host can list several DCs, comma separated: each thread sticks to one, and Kerberos uses the
# first (rotated per load generator) as its KDC.
ad.host=dc1.lab.local
ad.domain=LAB
ad.realm=LAB.LOCAL
ad.upnSuffix=lab.local
ad.baseDn=DC=lab,DC=local

ldap.port=636
ldap.tls=true
ldap.trustAll=true
ldap.connectTimeoutMs=5000
ldap.responseTimeoutMs=10000

# user = bind as each user and check their own membership
# service = long-lived service-account connection does the lookups (app-server pattern)
authz.bindAs=user
authz.groupDn=CN=LT-Authorised,CN=Users,DC=lab,DC=local
authz.serviceUser=svc-ltapp
authz.servicePassword=LoadTest-Passw0rd

kerberos.spn=ldap@dc1.lab.local

smb.share=netlogon
smb.minVersion=SMB202
smb.maxVersion=SMB210

# Load profile: threads per protocol (0 disables that thread group). Computers are machine-account
# Kerberos logons from computers.csv.
users.csv=/data/users.csv
computers.csv=/data/computers.csv
ldap.threads=5
kerberos.threads=5
ntlm.threads=5
computer.threads=0
rampup=10
duration=120
think.ms=0

# Target rate (login attempts per second) and total attempts per protocol for the whole run, across
# all load generators. 0 = as fast as the threads go / until duration. An attempt is one iteration:
# LDAP bind + authz, Kerberos TGT + service ticket, or one NTLM session.
ldap.rate=0
ldap.iterations=0
kerberos.rate=0
kerberos.iterations=0
ntlm.rate=0
ntlm.iterations=0
computer.rate=0
computer.iterations=0

# Failure testing: percentage of attempts sent with a wrong password (expected to be rejected).
# On a domain with account lockout, keep maxPerUser below the lockout threshold (0 = no cap).
badPassword.percent=0
badPassword.maxPerUser=0

# Live metrics for Grafana.
influx.url=http://influxdb:8086/write?db=jmeter
app=ad-loadtest
