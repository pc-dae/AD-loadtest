# Target Active Directory domain. With samba.enabled the chart runs its own lab DC and
# dc.host is derived from the release; otherwise set dc.host to a real domain controller.
domain:
  realm: LAB.LOCAL
  netbios: LAB
  upnSuffix: lab.local
  baseDn: DC=lab,DC=local
  authzGroupDn: CN=LT-Authorised,CN=Users,DC=lab,DC=local
  serviceUser: svc-ltapp
  # Kerberos service principal for service-ticket samples, service@host form. Only has to
  # exist in AD, the load generators never resolve it.
  kerberosSpn: ldap@dc1.lab.local

dc:
  # Hostname or IP the load generators connect to. Empty = the in-cluster Samba DC.
  host: ""
  # Several DCs: each load-generator thread sticks to one, Kerberos asks the first (rotated per
  # generator). Overrides host. Or take the comma-separated list from a key of the secret, e.g.
  # dc_ips from the AWS Terraform outputs.
  hosts: []
  hostsSecretKey: ""
  ldapPort: 636
  ldapTls: true
  ldapTrustAll: true
  smbShare: netlogon

# Lab passwords. Use existingSecret (keys adminPassword, testUserPassword) for anything real.
secrets:
  existingSecret: ""
  adminPassword: Adm1n-LoadTest!
  testUserPassword: LoadTest-Passw0rd

# Test users ltuser00001..N, seeded with one scheme by the Samba DC here, the PowerShell seeding
# for Windows DCs and this chart's users CSV, so expectations always match the directory:
#   i % 4 == 0  LT-Authorised            i % 8 == 1  nested one level ("nested")
#   i % 8 == 5  nested nestDepth deep    otherwise   LT-Denied
#   i % 10 == 0 also in roleGroups LT-Role-nnn groups ("heavy": large Kerberos tickets)
#   i % 50 == 3 disabled, i % 50 == 7 expired: logins are expected to be rejected
users:
  count: 500
  # Extra groups each "heavy" user is in, and the depth of the "deep" nesting chain. Only used
  # when the chart seeds the Samba DC; set the same values for Windows DCs in Terraform.
  roleGroups: 200
  nestDepth: 8
  # Computer accounts LTPC00001$... for machine-logon tests (computers.csv).
  computerCount: 100
  # Supply your own users.csv and/or computers.csv (keys users.csv, computers.csv) instead of generating them.
  existingConfigMap: ""

samba:
  enabled: true
  image:
    repository: ad-loadtest-samba-dc
    tag: dev
    pullPolicy: IfNotPresent
  hostname: dc1
  persistence:
    size: 1Gi
    storageClass: ""
  resources: {}

controller:
  image:
    repository: ad-loadtest-jmeter
    tag: dev
    pullPolicy: IfNotPresent
  # URL the browser uses to reach Grafana, for the embedded dashboard.
  grafanaUrl: http://localhost:3000
  heap: "-Xms512m -Xmx2g"
  service:
    type: ClusterIP
    nodePort: null
  persistence:
    size: 2Gi
    storageClass: ""
  # Extra JMeter properties appended to the generated profile.
  extraProperties: {}
  resources: {}

# Extra load generators: JMeter servers the controller spreads each run over. 0 = JMeter runs in
# the controller pod. Thread counts in a run must be a multiple of the number of generators used.
generators:
  replicas: 0
  heap: "-Xms512m -Xmx2g"
  resources: {}

# DC performance counters (CPU, LSASS, LDAP, Kerberos, NTLM/Netlogon) for the dashboard and run
# comparisons. Each Windows DC serves them on port 9273 (Telegraf, see infra/aws/ad); this scrapes
# the DCs in dc.hosts / dc.hostsSecretKey into InfluxDB.
dcMetrics:
  enabled: false
  port: 9273
  image:
    repository: telegraf
    tag: "1.40"

influxdb:
  image:
    repository: influxdb
    tag: "1.11"
  persistence:
    size: 2Gi
    storageClass: ""

grafana:
  image:
    repository: grafana/grafana-oss
    tag: "12.4.3"
  adminPassword: admin
  anonymousViewer: true
  service:
    type: ClusterIP
    nodePort: null

# Ingress for the web controller and Grafana, e.g. on mac-k8s clusters:
#   ingress: { enabled: true, hosts: { controller: ad-loadtest.kubernetes.local.internal,
#              grafana: ad-loadtest-grafana.kubernetes.local.internal } }
# and set controller.grafanaUrl to https://<grafana host>.
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: local-ca-issuer
  tls: true
  hosts:
    controller: ""
    grafana: ""
