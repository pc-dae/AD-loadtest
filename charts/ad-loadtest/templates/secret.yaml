{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adlt.secretName" . }}
  labels: {{- include "adlt.labels" . | nindent 4 }}
type: Opaque
stringData:
  adminPassword: {{ .Values.secrets.adminPassword | quote }}
  testUserPassword: {{ .Values.secrets.testUserPassword | quote }}
{{- end }}
