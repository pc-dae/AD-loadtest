# Local cluster for the Helm-deployed stack. Web UI on localhost:18080, Grafana on localhost:13000
# (different ports from docker compose, so both can run side by side).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ad-loadtest
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 18080, listenAddress: 127.0.0.1 }
      - { containerPort: 30300, hostPort: 13000, listenAddress: 127.0.0.1 }
